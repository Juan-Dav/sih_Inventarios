# Igual que el netlify.toml de la raíz, para cuando el sitio tiene configurada
# como "base directory" esta carpeta del frontend.

[build]
  command = "npm run build"
  publish = "dist/sih-inventarios-frontend/browser"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
