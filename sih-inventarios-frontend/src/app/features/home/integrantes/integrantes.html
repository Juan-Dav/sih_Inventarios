<section id="equipo" class="relative overflow-hidden bg-ink-50 py-16 lg:py-20">
  <div
    class="pointer-events-none absolute top-0 left-1/4 h-64 w-64 rounded-full bg-pop-100/60 blur-3xl"
    aria-hidden="true"
  ></div>

  <div class="shell relative">
    <!-- Encabezado -->
    <div class="mx-auto max-w-lg text-center">
      <span
        appReveal
        class="inline-flex items-center gap-2 rounded-full bg-brand-100 px-3 py-1 text-[0.65rem] font-bold tracking-[0.18em] text-brand-700 uppercase"
      >
        <span class="h-1.5 w-1.5 rounded-full bg-aqua-500"></span>
        Equipo fundador
      </span>
      <h2
        appReveal
        [appRevealDelay]="80"
        class="mt-3 font-display text-2xl font-extrabold tracking-tight text-ink-900 sm:text-3xl"
      >
        Mentes detrás del <span class="text-pop-500">software</span>
      </h2>
    </div>

    <!-- Tarjetas compactas -->
    <ul class="mt-9 grid grid-cols-2 gap-3 sm:gap-4 md:grid-cols-3 lg:grid-cols-5">
      @for (member of members; track member.name) {
        <li
          appReveal
          [appRevealDelay]="$index * 80"
          class="group relative flex flex-col items-center overflow-hidden rounded-2xl border border-ink-200 bg-white p-4 text-center shadow-sm transition-all duration-400 hover:-translate-y-2 hover:border-transparent hover:shadow-2xl hover:shadow-brand-600/15"
        >
          <div class="avatar-ring h-14 w-14">
            <span
              class="bg-gradient-to-br text-white transition-transform duration-500 group-hover:scale-105"
              [class]="member.gradient"
            >
              <svg
                class="h-8 w-8"
                fill="currentColor"
                viewBox="0 0 24 24"
                aria-hidden="true"
                focusable="false"
              >
                <path
                  d="M12 12.75c2.9 0 5.25-2.02 5.25-4.5S14.9 3.75 12 3.75 6.75 5.77 6.75 8.25 9.1 12.75 12 12.75Z"
                />
                <path
                  d="M18.4 20.02c-.98-2.55-3.31-4.27-6.4-4.27s-5.42 1.72-6.4 4.27c-.19.5.2 1.04.74 1.02 1.6-.07 3.5-.44 5.66-.44s4.06.37 5.66.44c.54.02.93-.52.74-1.02Z"
                />
              </svg>
            </span>
          </div>

          <h3 class="mt-3 text-xs leading-snug font-bold text-ink-900">{{ member.name }}</h3>
          <p class="mt-1 text-[0.6rem] font-semibold tracking-wide text-brand-700 uppercase">
            {{ member.role }}
          </p>

          <!-- Franja inferior que se despliega al hover -->
          <span
            class="mt-3 h-0.5 w-0 rounded-full bg-brand-gradient transition-all duration-500 group-hover:w-12"
            aria-hidden="true"
          ></span>
        </li>
      }
    </ul>
  </div>
</section>
