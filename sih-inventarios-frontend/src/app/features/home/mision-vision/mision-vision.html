<section id="mision-vision" class="relative overflow-hidden bg-white py-16 lg:py-20">
  <div
    class="pointer-events-none absolute top-1/2 left-1/2 h-72 w-[36rem] -translate-x-1/2 -translate-y-1/2 rounded-full bg-brand-100/50 blur-3xl"
    aria-hidden="true"
  ></div>

  <div class="shell relative">
    <!-- Encabezado -->
    <div class="mx-auto max-w-xl text-center">
      <span
        appReveal
        class="inline-flex items-center gap-2 rounded-full bg-ink-100 px-3 py-1 text-[0.65rem] font-bold tracking-[0.18em] text-ink-700 uppercase"
      >
        <span class="h-1.5 w-1.5 rounded-full bg-pop-500"></span>
        Identidad del proyecto
      </span>
      <h2
        appReveal
        [appRevealDelay]="80"
        class="mt-3 font-display text-2xl font-extrabold tracking-tight text-ink-900 sm:text-3xl"
      >
        Lo que nos <span class="text-pop-500">guía</span>
      </h2>
    </div>

    <!-- Tarjetas compactas -->
    <div class="mt-9 grid grid-cols-1 gap-5 md:grid-cols-2">
      @for (pillar of pillars; track pillar.key; let i = $index) {
        <article
          appReveal
          [appRevealDelay]="i * 120"
          class="group relative flex gap-4 overflow-hidden rounded-2xl border border-ink-200 bg-white p-5 shadow-sm transition-all duration-400 hover:-translate-y-1 hover:shadow-xl"
          [class]="pillar.ring"
        >
          <!-- Barra de color -->
          <span
            class="w-1 shrink-0 rounded-full transition-all duration-500"
            [class]="pillar.bar"
          ></span>

          <!-- Icono -->
          <span
            class="grid h-12 w-12 shrink-0 place-items-center rounded-xl transition-all duration-400 group-hover:scale-110 group-hover:rotate-[-6deg]"
            [class]="pillar.iconWrap"
          >
            <svg
              class="h-6 w-6"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              viewBox="0 0 24 24"
            >
              <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="pillar.icon" />
            </svg>
          </span>

          <!-- Texto -->
          <div class="min-w-0">
            <div class="flex items-center gap-2">
              <h3 class="font-display text-lg font-extrabold tracking-tight text-ink-900">
                {{ pillar.title }}
              </h3>
              <span
                class="rounded-full px-2 py-0.5 text-[0.6rem] font-bold tracking-wider uppercase text-white"
                [class]="pillar.bar"
              >
                {{ pillar.badge }}
              </span>
            </div>
            <p class="mt-2 text-sm leading-relaxed text-ink-700">
              {{ pillar.body }}
            </p>
          </div>

          <!-- Punto decorativo -->
          <span
            class="absolute -right-6 -bottom-6 h-20 w-20 rounded-full opacity-0 blur-2xl transition-opacity duration-500 group-hover:opacity-25"
            [class]="pillar.dot"
            aria-hidden="true"
          ></span>
        </article>
      }
    </div>
  </div>
</section>
