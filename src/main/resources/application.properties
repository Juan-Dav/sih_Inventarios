# ============================================================
# Base de datos
# ============================================================
# Conexión a MySQL en Aiven (puerto 10205, el público del servicio).
#
# sslMode=REQUIRED no es opcional en la práctica: el driver, sin este parámetro,
# conecta igual, pero en modo PREFERRED, que baja a texto plano si el servidor lo
# permite. Con REQUIRED el tráfico va cifrado por TLS sí o sí.
#
# VERIFY_IDENTITY también fallaría de entrada: el certificado de Aiven no está en
# el truststore de la JDK, así que habría que bajar el CA de Aiven a un archivo y
# apuntar trustCertificateKeyStoreUrl. Para una práctica, REQUIRED alcanza.
#
# La contraseña NO tiene valor por defecto a propósito: si estuviera escrita
# aquí acabaría en el repositorio, que es público. Sin DB_PASSWORD el backend
# falla al arrancar con un error claro, y es lo correcto: primero se define la
# variable, después arranca la aplicación.
#   Windows CMD:   set DB_PASSWORD=...
#   PowerShell:   $env:DB_PASSWORD="..."
#   Linux/macOS:  export DB_PASSWORD=...
# Si prefieres no usar variable de entorno, Spring Boot también lee el archivo
# src/main/resources/application-local.properties, que está en el .gitignore.
spring.datasource.url=${DB_URL:jdbc:mysql://mysql-3942e0e5-sih-inventarios.c.aivencloud.com:10205/sih_inventarios?sslMode=REQUIRED&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD:}

# server.port lo sobrescribe Render con su variable PORT. El 8080 es el valor por
# defecto para correr en local.
server.port=${PORT:8080}

# ============================================================
# Configuración de JPA / Hibernate
# ============================================================
# "update" crea los tablas que falten a partir de las entidades, y los deja
# como están si ya existen. Es lo que permite que el esquema nazca solo en una
# base de datos recién creada, como la de Aiven.
spring.jpa.hibernate.ddl-auto=update

# show-sql y format_sql se apagaron: imprimir cada consulta por consola añade
# retardo real a cada petición y, con format_sql=true, el coste se multiplica.
# Para depurar, ponlos en true temporalmente.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# El dialecto ya se detecta solo de la conexión; forzar MySQLDialect además
# genera un warning de Hibernate 7.
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Pool de conexiones: reduce el tiempo de espera al abrir la primera conexión
# y evita que se agoten si llegan varias peticiones juntas.
spring.datasource.hikari.initialization-fail-timeout=1
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Rotar y mantener vivas las conexiones ociosas. Sin esto, cuando el equipo se
# suspende o la red corta la conexión, Hikari la encuentra cerrada al despertar
# y aparece el aviso "No operations allowed after connection closed"; además la
# primera petición después de un rato sin uso espera a descartarlas.
# max-lifetime debe ser mayor que idle-timeout (Hikari avisa en caso contrario).
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.keepalive-time=300000

# Cerrar la sesión de JPA al terminar cada petición: sin esto Spring mantiene
# la EntityManager abierta durante el renderizado (aviso open-in-view).
spring.jpa.open-in-view=false

# Ejecuta data.sql (carga inicial de roles) también en MySQL, y después de crear las tablas
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ============================================================
# Seguridad JWT
# ============================================================
# Clave de firma. HS256 exige al menos 256 bits (32 bytes), por eso el texto es
# largo. Sale de JWT_SECRET para poder cambiarla sin tocar el código; el valor
# entre corchetes es el de desarrollo y sirve para que el proyecto arranque.
# Ojo: quien conozca esta clave puede firmar tokens de administrador, así que en
# un despliegue real tiene que ser una variable de entorno sin valor por defecto.
app.jwt.secret=${JWT_SECRET:SIH_INVENTARIOS_2026_CLAVE_DE_FIRMA_SUPERSECURA_DE_256_BITS_MINIMO}
# Duración del token: 24 horas en milisegundos
app.jwt.expiration-ms=86400000

# ============================================================
# Cuenta de administrador inicial (apagada)
# ============================================================
# Esta clase creaba un admin@sih.local para que hubiera por dónde entrar, porque
# el registro público solo dejaba crear cuentas de DOCENTE y así la primera
# cuenta de administración no se podía crear nunca.
#
# Ya no hace falta: el registro público permite elegir entre ADMINISTRADOR,
# TECNICO y DOCENTE, así que la primera cuenta de administrador se crea desde
# el propio formulario y con el correo que uno quiera.
#
# Se deja en false a propósito para que el backend no regenere ninguna cuenta
# al arrancar. Si en algún momento hubiera que bloquear el registro público,
# basta con volver a ponerla en true y sirve de puerta de entrada de respaldo.
app.bootstrap.admin.activado=false

# ============================================================
# Formas de pago
# ============================================================
# Plan gratuito: 2 salas y 12 equipos como máximo en cada una.
# Plan Premium ($150.000, compra dentro del software): sin límites de salas
# ni de equipos por sala. Los valores se copian a la tabla `plan_institucion`
# al leer el plan, así que cambiar esto también actualiza el plan que ya
# estuviera guardado; el Premium no se toca porque no lleva topes.
app.plan.gratuito.max-salas=2
app.plan.gratuito.max-equipos-por-sala=12
app.plan.premium.precio=150000
